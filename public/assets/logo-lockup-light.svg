<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="AI for All">
  <title>AI for All — horizontal lockup (for light backgrounds)</title>
  <defs>
    <linearGradient id="afaLeftL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0EA5E9"/>
      <stop offset="45%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="afaRightL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="55%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path d="M66 30 C 52 9, 23 11, 15 34 C 7 57, 26 79, 62 107" stroke="url(#afaLeftL)"/>
    <path d="M54 30 C 68 9, 97 11, 105 34 C 113 57, 94 79, 58 107" stroke="url(#afaRightL)"/>
  </g>
  <circle cx="60" cy="26" r="7.5" fill="#1D4ED8"/>

  <!-- NOTE: convert to outlines before shipping as a brand asset (see README) -->
  <text x="146" y="80"
        font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="500" letter-spacing="-0.5"
        fill="#0B1220">AI for All</text>
</svg>
