<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="AI for All">
  <title>AI for All — single-colour lockup (currentColor)</title>
  <!-- Single-colour version. Inherits `color` from CSS, so one file covers
       white-on-dark, navy-on-light, embroidery, favicons and print. -->
  <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round">
    <path d="M66 30 C 52 9, 23 11, 15 34 C 7 57, 26 79, 62 107"/>
    <path d="M54 30 C 68 9, 97 11, 105 34 C 113 57, 94 79, 58 107"/>
  </g>
  <circle cx="60" cy="26" r="7.5" fill="currentColor"/>
  <text x="146" y="80"
        font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="500" letter-spacing="-0.5"
        fill="currentColor">AI for All</text>
</svg>
