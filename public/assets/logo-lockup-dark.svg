<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="AI for All">
  <title>AI for All — horizontal lockup (for dark backgrounds)</title>
  <defs>
    <linearGradient id="afaLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4"/>
      <stop offset="45%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="afaRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="55%"  stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="afaNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path d="M66 30 C 52 9, 23 11, 15 34 C 7 57, 26 79, 62 107" stroke="url(#afaLeft)"/>
    <path d="M54 30 C 68 9, 97 11, 105 34 C 113 57, 94 79, 58 107" stroke="url(#afaRight)"/>
  </g>
  <circle cx="60" cy="26" r="7.5" fill="url(#afaNode)"/>

  <!-- NOTE: convert to outlines before shipping as a brand asset (see README) -->
  <text x="146" y="80"
        font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="500" letter-spacing="-0.5"
        fill="#FFFFFF">AI for All</text>
</svg>
